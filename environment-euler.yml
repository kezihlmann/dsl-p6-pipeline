name: dsl-p6-pipeline
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - mkl<2024.1
  - intel-openmp<2024.1
  - numpy
  - pillow
  - scipy
  - shapely
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.1
  - pip
  - pip:
      - transformers
      - huggingface_hub
      - wandb
      - plyfile
      - ffmpeg-python
      - lpips
      - ninja
      - cmake
      - open3d
